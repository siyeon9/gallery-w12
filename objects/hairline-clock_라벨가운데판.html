<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>하루 · 전자시계</title>
<link rel="icon" href="data:,">
<!--
  10주 · 하루(Day) — 하루를 채우는 다섯 곡을 담은 탁상 전자시계.
  아래 시간 버튼을 누르면 액정에 그 시각이 뜨고, 그 시간에 듣는 곡의 앨범 커버 · 제목 · 재생바가 나온다.
  재생 버튼을 누르면 재생바가 흘러간다(소리는 나지 않는다). 시계 몸체를 누르면 10주 서브 페이지로 간다(갤러리 안에서만).
  커버: 01 · 04는 레코드 페이지의 재킷 파일, 02 · 03 · 05는 레코드 페이지와 같은 youtube 공식 영상 썸네일(학생 확인: 사용 허가 받음).
-->
<style>
  :root { --bg: #050505; --ink: #f2f2f0; --muted: rgba(242,242,240,.55); --seg: #191d1f; --ghost: rgba(25,29,31,.045); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden;
    font: 14px/1.4 "Pretendard", "Apple SD Gothic Neo", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  #fit { position: absolute; left: 50%; top: 50%; width: 1000px; height: 800px; transform-origin: 0 0; }

  /* 장면 */
  .scene { position: absolute; left: 0; top: 40px; width: 1000px; height: 560px; perspective: 1700px; perspective-origin: 50% 30%; }
  .floor { position: absolute; left: 50%; top: 468px; width: 640px; height: 70px; margin-left: -320px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(0,0,0,.95), rgba(0,0,0,.6) 55%, rgba(0,0,0,0)); }
  .glow { position: absolute; left: 50%; top: 150px; width: 900px; height: 420px; margin-left: -450px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(255,255,255,.07), rgba(255,255,255,0)); pointer-events: none; }
  .rig { position: absolute; left: 50%; top: 92px; width: 640px; height: 350px; margin-left: -320px; transform-style: preserve-3d; }
  .clock { position: absolute; inset: 0; transform-style: preserve-3d; cursor: pointer; }
  .layer { position: absolute; inset: 0; border-radius: 86px; }
  /* 앞면: 흰 플라스틱 */
  .face { position: absolute; inset: 0; border-radius: 86px; transform: translateZ(0);
    background: linear-gradient(165deg, #ffffff 0%, #f6f6f4 40%, #e6e6e3 100%);
    box-shadow: inset 0 2px 1px rgba(255,255,255,.9), inset 0 -6px 14px rgba(0,0,0,.08), inset 10px 0 18px rgba(255,255,255,.6); }
  .bezel { position: absolute; left: 30px; right: 30px; top: 30px; bottom: 30px; border-radius: 30px;
    background: linear-gradient(180deg, #dcdcd9, #f3f3f1); box-shadow: inset 0 3px 6px rgba(0,0,0,.18), 0 1px 0 rgba(255,255,255,.9); }
  /* 액정 */
  .lcd { position: absolute; left: 40px; right: 40px; top: 40px; bottom: 40px; border-radius: 22px; overflow: hidden;
    background: linear-gradient(180deg, #eef1ef 0%, #e2e6e4 100%);
    box-shadow: inset 0 2px 8px rgba(0,0,0,.25), inset 0 0 0 1px rgba(0,0,0,.08); display: grid; grid-template-columns: 1fr 1px 196px; }
  .lcd::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(118deg, rgba(255,255,255,.55) 0%, rgba(255,255,255,.08) 34%, rgba(255,255,255,0) 35%, rgba(255,255,255,0) 100%); }
  .lcd.flick .left, .lcd.flick .right { animation: flick .42s steps(3) 1; }
  @keyframes flick { 0% { opacity: .15 } 50% { opacity: .7 } 100% { opacity: 1 } }

  .left { position: relative; padding: 22px 20px 18px 26px; color: var(--seg); }
  .ampm { position: absolute; left: 22px; top: 62px; font: 700 13px/1 "Helvetica Neue", Arial, sans-serif; letter-spacing: .04em; }
  .ampm span { opacity: .07; } .ampm span.on { opacity: 1; }
  .ampm span + span { display: block; margin-top: 4px; }
  #time { position: absolute; left: 52px; top: 58px; width: 300px; height: 150px; }
  .now { position: absolute; left: 26px; bottom: 18px; font: 600 12px/1 "Helvetica Neue", Arial, sans-serif; letter-spacing: .08em; color: var(--seg); }
  .now b { font-weight: 600; letter-spacing: 0; margin-left: 6px; font-family: "Pretendard", "Apple SD Gothic Neo", sans-serif; }
  .zz { position: absolute; left: 236px; top: 178px; font: 700 11px/1 Arial; color: var(--seg); opacity: .07; }
  .sep { background: rgba(25,29,31,.35); margin: 18px 0; }

  .right { padding: 12px 16px 12px 18px; display: flex; flex-direction: column; justify-content: center; color: var(--seg); min-width: 0; }
  .cap { font: 700 10px/1 "Helvetica Neue", Arial, sans-serif; letter-spacing: .08em; display: flex; justify-content: space-between; }
  .cover { margin-top: 12px; width: 100%; aspect-ratio: 1; height: auto; max-height: 112px; max-width: 112px; border-radius: 3px; overflow: hidden; background: #c9cecb;
    box-shadow: 0 0 0 1px rgba(0,0,0,.12); align-self: flex-start; position: relative; }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; filter: saturate(.9) contrast(.98); }
  .meta { display: flex; align-items: flex-start; gap: 8px; margin-top: 8px; min-width: 0; }
  .meta .txt { min-width: 0; flex: 1; }
  .ttl { font-weight: 700; font-size: 13px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .art { font-size: 11px; line-height: 1.3; color: rgba(25,29,31,.62); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar { margin-top: 9px; height: 4px; border-radius: 2px; background: rgba(25,29,31,.14); position: relative; }
  .bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; background: var(--seg); width: 0; }
  .bar i::after { content: ""; position: absolute; right: -4px; top: -3px; width: 10px; height: 10px; border-radius: 50%; background: var(--seg); }
  .tms { display: flex; justify-content: space-between; margin-top: 5px; font: 600 10px/1 "Helvetica Neue", Arial, sans-serif; font-variant-numeric: tabular-nums; color: rgba(25,29,31,.62); }
  .play { flex: none; width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(--seg); background: transparent; color: var(--seg); cursor: pointer; display: grid; place-items: center; padding: 0; }
  .play:hover { background: var(--seg); color: #e8ebe9; }
  .play svg { width: 13px; height: 13px; fill: currentColor; }

  /* 시간 버튼 */
  .times { position: absolute; left: 0; right: 0; top: 590px; display: flex; justify-content: center; gap: 8px; }
  .times button { font: inherit; font-size: 13px; line-height: 1.2; color: var(--muted); background: transparent; border: 1px solid rgba(242,242,240,.22);
    border-radius: 999px; padding: 8px 14px; cursor: pointer; transition: color .2s, border-color .2s, background .2s; }
  .times button b { display: block; font: 600 16px/1.1 "Helvetica Neue", Arial, sans-serif; letter-spacing: .01em; color: var(--ink); font-variant-numeric: tabular-nums; }
  .times button span { display: block; font-size: 11px; margin-top: 3px; }
  .times button:hover { border-color: rgba(242,242,240,.6); color: var(--ink); }
  .times button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: rgba(5,5,5,.7); }
  .times button[aria-pressed="true"] b { color: #050505; }
  .times button:focus-visible, .play:focus-visible { outline: 2px solid #8fc1ff; outline-offset: 3px; }
  .hint { position: absolute; left: 0; right: 0; top: 742px; text-align: center; font-size: 12px; color: rgba(242,242,240,.4); }
  .embed .hint { display: none; }
  .yt { position: absolute; left: 0; right: 0; top: 664px; margin: 0; text-align: center; font-size: 11px; }
  .yt a { color: var(--ink); text-decoration: underline; text-underline-offset: 5px; text-decoration-thickness: 1px; }
  .yt a:hover { color: #ff4e45; }
  .yt span { display: block; margin-top: 4px; font-size: 11px; color: rgba(242,242,240,.5); min-height: 1em; }
  .hint { top: 712px !important; }
  .embed .yt { top: 670px; font-size: 12px; }
  .bar { cursor: pointer; }
  .bar::before { content: ""; position: absolute; left: 0; right: 0; top: -8px; bottom: -8px; }
  #ytwrap { position: absolute; left: -10000px; top: 0; width: 240px; height: 180px; overflow: hidden; }
  .hint a { color: rgba(242,242,240,.75); text-underline-offset: 4px; }
  .hint a:hover { color: #fff; }

  @media (prefers-reduced-motion: reduce) { .lcd.flick .left, .lcd.flick .right { animation: none; } }
</style>
</head>
<body>
<div id="fit">
  <div class="scene">
    <div class="glow"></div>
    <div class="floor"></div>
    <div class="rig" id="rig">
      <div class="clock" id="clock" role="link" aria-label="10주 하루 페이지로 가기">
        <div id="layers"></div>
        <div class="face">
          <div class="bezel"></div>
          <div class="lcd" id="lcd">
            <div class="left">
              <div class="ampm"><span id="am">AM</span><span id="pm">PM</span></div>
              <svg id="time" viewBox="0 0 300 150" aria-hidden="true"></svg>
              <div class="zz">Zz</div>
              <div class="now">NOW<b id="when"></b></div>
            </div>
            <div class="sep"></div>
            <div class="right">
              <div class="cap"><span id="no">01 / 05</span><span>NOW PLAYING</span></div>
              <div class="cover"><img id="cover" alt=""></div>
              <div class="meta">
                <div class="txt"><div class="ttl" id="ttl"></div><div class="art" id="art"></div></div>
                <button class="play" id="play" type="button" aria-label="재생"></button>
              </div>
              <div class="bar"><i id="fill"></i></div>
              <div class="tms"><span id="pos">0:00</span><span id="len">0:00</span></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="times" id="times" role="group" aria-label="하루의 다섯 시간"></div>
  <p class="yt"><a id="ytlink" href="#" target="_blank" rel="noopener">▶ YouTube에서 보기 ↗</a><span id="msg"></span></p>
  <p class="hint">시간을 누르고 재생 버튼을 누르면 그 시간에 듣는 곡이 나와요 · <a href="../작품/10주/레코드/index.html" target="_top">레코드 페이지 열기 →</a></p>
</div>
<div id="ytwrap" aria-hidden="true"><div id="ytp"></div></div>
<script>
(() => {
  const REC = "../작품/10주/레코드/";
  const yt = (id) => ["https://i.ytimg.com/vi/" + id + "/maxresdefault.jpg", "https://i.ytimg.com/vi/" + id + "/hqdefault.jpg"];
  const SONGS = [
    { h: 7,  when: "눈 뜰 때",      title: "아윌다이포유♥x3",      artist: "잔나비",        len: 215, id: "45GQdk_z3po", img: [REC + "01_재킷.webp", ...yt("45GQdk_z3po")] },
    { h: 9,  when: "집을 나설 때",  title: "sunny days",            artist: "wave to earth", len: 236, id: "hRjC3ek0Oxk", img: yt("hRjC3ek0Oxk") },
    { h: 14, when: "잠깐 쉴 때",    title: "UNDERCOVER",            artist: "OSUN",          len: 198, id: "99qOyvf7kdw", img: yt("99qOyvf7kdw") },
    { h: 19, when: "돌아가는 길",   title: "Last Night on Earth",   artist: "Green Day",     len: 237, id: "oVZg-WwgivI", img: [REC + "04_재킷.webp", ...yt("oVZg-WwgivI")] },
    { h: 23, when: "잠들기 전",     title: "Cheapest Flight",       artist: "PREP",          len: 221, id: "rqvA7T5FUTQ", img: yt("rqvA7T5FUTQ") },
  ];
  const $ = (id) => document.getElementById(id);
  const embed = new URLSearchParams(location.search).get("embed");
  if (embed) document.body.classList.add("embed");

  /* 화면 맞춤: 1000 × 800 설계 크기를 창에 맞춰 줄인다 */
  const fit = () => { const s = Math.min(innerWidth / 1000, innerHeight / 800); $("fit").style.transform = `scale(${s}) translate(-50%, -50%)`; };
  addEventListener("resize", fit); fit();

  /* 몸체 두께: 같은 모양 판을 뒤로 겹쳐 쌓는다(앞쪽은 밝게, 뒤로 갈수록 어둡게) */
  const N = 36, STEP = 4.2, L = $("layers");
  for (let i = N; i >= 1; i--) {
    const d = document.createElement("div"); d.className = "layer";
    const t = i / N, v = Math.round(236 - t * 44), w = Math.round(226 - t * 50);
    d.style.transform = `translateZ(${-i * STEP}px)`;
    d.style.background = i === N ? "#a9a9a6" : `linear-gradient(180deg, rgb(${v},${v},${v - 2}), rgb(${w},${w},${w - 3}))`;
    if (i === 1) d.style.boxShadow = "inset 0 0 0 1px rgba(0,0,0,.05)";
    L.appendChild(d);
  }

  /* 7세그먼트 숫자 */
  const SEG = { 0: "abcdef", 1: "bc", 2: "abged", 3: "abgcd", 4: "fgbc", 5: "afgcd", 6: "afgedc", 7: "abc", 8: "abcdefg", 9: "abcfgd" };
  const NSV = "http://www.w3.org/2000/svg";
  function segPaths(x, y, W, H, t, k) {
    const g = t * .18, h = H / 2, s = t / 2;
    const hz = (yy) => `M${x + s + g} ${yy} L${x + s + t * .5 + g} ${yy - s} L${x + W - s - t * .5 - g} ${yy - s} L${x + W - s - g} ${yy} L${x + W - s - t * .5 - g} ${yy + s} L${x + s + t * .5 + g} ${yy + s} Z`;
    const vt = (xx, y1, y2) => `M${xx} ${y1 + g} L${xx + s} ${y1 + s + g} L${xx + s} ${y2 - s - g} L${xx} ${y2 - g} L${xx - s} ${y2 - s - g} L${xx - s} ${y1 + s + g} Z`;
    const sk = (p) => p; // 기울기는 svg transform으로
    return { a: hz(y + s), g: hz(y + h), d: hz(y + H - s), f: vt(x + s, y + s, y + h), b: vt(x + W - s, y + s, y + h), e: vt(x + s, y + h, y + H - s), c: vt(x + W - s, y + h, y + H - s) };
  }
  function drawTime(hh, mm, colon) {
    const sv = $("time"); sv.innerHTML = "";
    const root = document.createElementNS(NSV, "g"); root.setAttribute("transform", "skewX(-6) translate(14 0)"); sv.appendChild(root);
    const digits = [hh >= 10 ? 1 : null, hh % 10, Math.floor(mm / 10), mm % 10];
    const xs = [0, 46, 150, 222], ws = [26, 64, 64, 64];
    digits.forEach((d, i) => {
      const P = segPaths(xs[i] + (i === 0 ? 0 : 0), 4, i === 0 ? 26 : ws[i], 140, 13);
      const on = d === null ? "" : (i === 0 ? "bc" : SEG[d]);
      Object.keys(P).forEach((k) => {
        if (i === 0 && !"bc".includes(k)) return;
        const p = document.createElementNS(NSV, "path"); p.setAttribute("d", P[k]);
        p.setAttribute("fill", on.includes(k) ? "var(--seg)" : "var(--ghost)"); root.appendChild(p);
      });
    });
    [46, 100].forEach((cy) => { const c = document.createElementNS(NSV, "rect"); c.setAttribute("x", 124); c.setAttribute("y", cy - 6); c.setAttribute("width", 12); c.setAttribute("height", 12); c.setAttribute("rx", 2);
      c.setAttribute("fill", colon ? "var(--seg)" : "var(--ghost)"); root.appendChild(c); });
  }

  /* 상태 */
  let sel = 0, playing = false, pos = 0, len = 0, last = performance.now(), colon = true;
  let P = null, ready = false, ytOk = true, cued = -1;
  const now = new Date().getHours();
  SONGS.forEach((s, i) => { if (now >= s.h) sel = i; });
  if (now < 7) sel = 4;
  const mmss = (v) => Math.floor(v / 60) + ":" + String(Math.floor(v % 60)).padStart(2, "0");
  const ICON_PLAY = '<svg viewBox="0 0 12 12"><path d="M3 1.5 L10.5 6 L3 10.5 Z"/></svg>';
  const ICON_PAUSE = '<svg viewBox="0 0 12 12"><rect x="2.2" y="1.5" width="2.8" height="9" rx=".6"/><rect x="7" y="1.5" width="2.8" height="9" rx=".6"/></svg>';
  const watch = (s) => "https://www.youtube.com/watch?v=" + s.id;
  const say = (t) => { $("msg").textContent = t || ""; };

  function setCover(list) {
    const img = $("cover"); let i = 0;
    img.onerror = () => { i++; if (i < list.length) img.src = list[i]; else img.removeAttribute("src"); };
    img.src = list[0];
  }
  function show(i, flick) {
    sel = i; const s = SONGS[i]; pos = 0; len = s.len;
    const h12 = s.h % 12 || 12;
    $("am").classList.toggle("on", s.h < 12); $("pm").classList.toggle("on", s.h >= 12);
    drawTime(h12, 0, colon);
    $("when").textContent = s.when;
    $("no").textContent = String(i + 1).padStart(2, "0") + " / 05";
    $("ttl").textContent = s.title; $("art").textContent = s.artist;
    $("cover").alt = s.title + " 앨범 커버";
    setCover(s.img);
    $("ytlink").href = watch(s);
    $("ytlink").textContent = "▶ YouTube에서 보기 · " + s.title + " ↗";
    paint();
    [...$("times").children].forEach((b, k) => b.setAttribute("aria-pressed", String(k === i)));
    if (flick) { const l = $("lcd"); l.classList.remove("flick"); void l.offsetWidth; l.classList.add("flick"); }
  }
  function paint() {
    $("fill").style.width = (len ? Math.min(1, pos / len) * 100 : 0) + "%";
    $("pos").textContent = mmss(pos);
    $("len").textContent = mmss(len);
    $("play").innerHTML = playing ? ICON_PAUSE : ICON_PLAY;
    $("play").setAttribute("aria-label", playing ? "일시정지" : "재생");
  }

  /* YouTube 플레이어(화면 밖에 숨김): 소리만 시계에서 나온다 */
  const canYT = location.protocol !== "file:";
  if (canYT) {
    const tag = document.createElement("script"); tag.src = "https://www.youtube.com/iframe_api";
    tag.onerror = () => { ytOk = false; };
    document.head.appendChild(tag);
    window.onYouTubeIframeAPIReady = () => {
      P = new YT.Player("ytp", { width: 240, height: 180, videoId: SONGS[sel].id, playerVars: { playsinline: 1, rel: 0, controls: 0 },
        events: {
          onReady: () => { ready = true; cued = sel; },
          onStateChange: (e) => {
            if (e.data === YT.PlayerState.PLAYING) { playing = true; say(""); }
            else if (e.data === YT.PlayerState.PAUSED) playing = false;
            else if (e.data === YT.PlayerState.ENDED) { playing = false; pos = len; }
            paint();
          },
          onError: (e) => { playing = false; paint(); say(e.data === 101 || e.data === 150 ? "이 곡은 YouTube에서만 재생돼요. 위 링크로 들어 주세요." : "YouTube 재생이 막혔어요 (오류 " + e.data + ")"); },
        } });
    };
  } else { ytOk = false; }

  function playSel() {
    if (ready && ytOk) {
      if (cued !== sel) { P.loadVideoById(SONGS[sel].id); cued = sel; } else P.playVideo();
      playing = true; paint();
    } else {
      say(canYT ? "YouTube를 불러오는 중이에요. 잠시 뒤 다시 눌러 주세요." : "파일로 열면 YouTube가 재생을 막아요. 위 링크로 들어 주세요.");
    }
  }
  function pauseSel() { if (ready) P.pauseVideo(); playing = false; paint(); }

  SONGS.forEach((s, i) => {
    const b = document.createElement("button"); b.type = "button";
    b.innerHTML = `<b>${String(s.h).padStart(2, "0")}:00</b><span>${s.when}</span>`;
    b.addEventListener("click", (e) => {
      e.stopPropagation(); if (i === sel) return;
      const was = playing; say("");
      show(i, true);
      if (ready && ytOk) { if (was) { P.loadVideoById(s.id); playing = true; } else { P.cueVideoById(s.id); playing = false; } cued = i; }
      paint();
    });
    $("times").appendChild(b);
  });
  $("play").addEventListener("click", (e) => { e.stopPropagation(); playing ? pauseSel() : playSel(); });
  $("play").closest(".right").addEventListener("click", (e) => e.stopPropagation());
  document.querySelector(".bar").addEventListener("click", (e) => {
    e.stopPropagation();
    const r = e.currentTarget.getBoundingClientRect(), f = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
    if (!(ready && ytOk)) { playSel(); return; }
    if (cued !== sel) { playSel(); return; }
    const t = f * (P.getDuration() || len); P.seekTo(t, true); pos = t; if (!playing) P.playVideo(); paint();
  });

  /* 시계 몸체를 누르면 10주 페이지로(갤러리 안에서만) */
  let armed = false, timer = 0, kind = "mouse";
  $("clock").addEventListener("pointerdown", (e) => { kind = e.pointerType; }, true);
  $("clock").addEventListener("click", () => {
    if (!embed) return;
    if (kind !== "mouse" && !armed) { armed = true; clearTimeout(timer); timer = setTimeout(() => { armed = false; }, 3000); return; }
    parent.postMessage({ gallery: "go", week: Number(new URLSearchParams(location.search).get("week")) || 10 }, "*");
  });

  /* 시계는 가운데에 고정. 콜론 깜빡임과 재생바만 움직인다 */
  function loop(t) {
    last = t;
    if (ready && cued === sel) {
      try { const d = P.getDuration(); if (d) len = d; if (playing) pos = P.getCurrentTime() || pos; } catch (_) {}
      if (playing) paint();
    }
    const c = Math.floor(t / 1000) % 2 === 0;
    if (c !== colon) { colon = c; const s = SONGS[sel]; drawTime(s.h % 12 || 12, 0, colon); }
    requestAnimationFrame(loop);
  }
  show(sel, false);
  requestAnimationFrame(loop);

  addEventListener("message", () => {}); // 갤러리의 테마 메시지는 쓰지 않는다(늘 검은 바탕)
})();
</script>
</body>
</html>
